version: "3.9"

services:
  # ---------------------------------------------------------------------------
  # 1. POSTGRESQL (LEGACY & ENTERPRISE COMPLIANCE DATABASE)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: sentinel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sentinel_db
      POSTGRES_USER: sentinel_admin
      POSTGRES_PASSWORD: SentinelEnterpriseSecret2026
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel_admin -d sentinel_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - enterprise-internal-net

  # ---------------------------------------------------------------------------
  # 2. SECURE MCP SERVER BRIDGE
  # Exposes PostgreSQL tools to LangGraph agents via Model Context Protocol
  # ---------------------------------------------------------------------------
  mcp-server:
    build:
      context: ../mcp-server
      dockerfile: Dockerfile
    container_name: sentinel-mcp-server
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: sentinel_db
      POSTGRES_USER: sentinel_admin
      POSTGRES_PASSWORD: SentinelEnterpriseSecret2026
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - enterprise-internal-net

  # ---------------------------------------------------------------------------
  # 3. ISOLATED OFFLINE AI ENGINE (LLAMA-3 8B QLORA INFERENCE)
  # Strictly air-gapped on isolated internal network with no internet gateway
  # ---------------------------------------------------------------------------
  ai-engine:
    build:
      context: ../ai-engine
      dockerfile: Dockerfile
    container_name: sentinel-ai-engine
    restart: unless-stopped
    environment:
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_OFFLINE: "1"
      CUDA_VISIBLE_DEVICES: "0"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ai-checkpoints:/app/checkpoints
      - ai-reports:/app/reports
    networks:
      - ai-airgap-net # No internet access
    # Denies default bridge outbound routing for strict enterprise data residency

  # ---------------------------------------------------------------------------
  # 4. LANGGRAPH AGENT ORCHESTRATOR & FASTAPI BACKEND
  # ---------------------------------------------------------------------------
  agent-orchestrator:
    build:
      context: ../agent-orchestrator
      dockerfile: Dockerfile
    container_name: sentinel-orchestrator
    restart: unless-stopped
    environment:
      PORT: 8000
      POSTGRES_HOST: postgres
      MCP_SERVER_HOST: http://mcp-server:8001
      AI_ENGINE_HOST: http://ai-engine:8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mcp-server:
        condition: service_started
    networks:
      - enterprise-internal-net
      - ai-airgap-net

  # ---------------------------------------------------------------------------
  # 5. ENTERPRISE REACT FRONTEND DASHBOARD
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: sentinel-frontend
    restart: unless-stopped
    environment:
      VITE_ORCHESTRATOR_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - agent-orchestrator
    networks:
      - enterprise-internal-net

# -----------------------------------------------------------------------------
# NETWORK TOPOLOGY & ENTERPRISE ISOLATION POLICIES
# -----------------------------------------------------------------------------
networks:
  enterprise-internal-net:
    driver: bridge
  ai-airgap-net:
    driver: bridge
    internal: true # STRICT AIR-GAP: Prohibits external internet routing

# -----------------------------------------------------------------------------
# PERSISTENT VOLUMES
# -----------------------------------------------------------------------------
volumes:
  postgres-data:
  ai-checkpoints:
  ai-reports:
